<title>Обмерный план квартиры</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting table — plan canvas fills the left, a tall property sheet docks right (stacks below on phones). */
:root{
  --paper:#F3F2EE; --sheet:#FFFFFF; --ink:#23262B; --muted:#6B6F76; --line:#D9D7D0;
  --wall:#6E6A62; --wallhatch:#4A4740; --blue:#1F5FA8; --blue-soft:rgba(31,95,168,.10);
  --warn:#C9741A; --warn-soft:rgba(201,116,26,.12); --ok:#2E7D4F; --bad:#B3342B;
  --room:#FBFAF6; --room-check:#FFF5E8; --sel:#E2462E;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181B; --sheet:#1E2125; --ink:#E6E4DE; --muted:#9A9DA3; --line:#33373D;
  --wall:#8C877D; --wallhatch:#B5AFA3; --blue:#6FA6E8; --blue-soft:rgba(111,166,232,.14);
  --warn:#E8A050; --warn-soft:rgba(232,160,80,.14); --ok:#5FBF86; --bad:#EF6B60;
  --room:#202328; --room-check:#2B2620; --sel:#FF6F55; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181B; --sheet:#1E2125; --ink:#E6E4DE; --muted:#9A9DA3; --line:#33373D;
  --wall:#8C877D; --wallhatch:#B5AFA3; --blue:#6FA6E8; --blue-soft:rgba(111,166,232,.14);
  --warn:#E8A050; --warn-soft:rgba(232,160,80,.14); --ok:#5FBF86; --bad:#EF6B60;
  --room:#202328; --room-check:#2B2620; --sel:#FF6F55; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;margin:0}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--sheet)}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.err{background:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
button,.btn{font:500 13px var(--sans);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.danger{color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper);touch-action:none}
svg#plan{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:calc(100% - 24px);pointer-events:none}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;padding:0;font-size:17px}
aside{border-left:1px solid var(--line);background:var(--sheet);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 6px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);background:transparent}
.pane{overflow:auto;padding:14px 16px 24px;min-height:0;flex:1}
.pane h2{font-size:13px;font-weight:600;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pane h3{font-size:15px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:400 14px var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:6px 7px;min-width:0;width:100%;box-sizing:border-box}
input[type=checkbox]{width:auto}
textarea{font-family:var(--sans);min-height:90px;resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.calc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
table.m{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.m th{font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
table.m td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.m tr.sel td{background:var(--blue-soft)}
table.m td.L{font-weight:700;color:var(--blue);font-size:15px;cursor:pointer;width:22px}
table.m td.n{font-size:12px;cursor:pointer}
table.m td.n small{display:block;color:var(--muted)}
table.m input{padding:4px 5px;width:68px;font-size:13px}
table.m td.n{max-width:110px}
.d{font-family:var(--mono);font-size:12px}
.d.ok{color:var(--ok)} .d.bad{color:var(--bad);font-weight:600}
.list button{display:flex;justify-content:space-between;width:100%;margin-bottom:4px;text-align:left;gap:8px}
.list button span{color:var(--muted);font-family:var(--mono);font-size:12px}
.sep{height:1px;background:var(--line);margin:16px 0}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.useg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.useg button{border:0;border-radius:0;padding:6px 14px;min-height:34px;font-family:var(--mono)}
.useg button+button{border-left:1px solid var(--line)}
.useg button.on{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.confirm{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:10px;margin-top:10px;font-size:13px}
@media (max-width:820px){
  .hint{font-size:11px;padding:4px 7px;left:8px;bottom:8px;max-width:calc(100% - 60px)}
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .canvas{height:68vh;min-height:380px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
<header>
  <h1>Обмерный план · 100,58 м²</h1>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Загрузка плана…</span></div>
  <label class="status" for="unitSel">Единицы <select id="unitSel" style="width:auto;padding:3px 6px;font-size:13px"><option value="m">м</option><option value="cm">см</option><option value="mm">мм</option></select></label>
  <div class="tools">
    <button id="bSelect" class="on" title="Выбор и перемещение (V)">Выбор</button>
    <button id="bRuler" title="Рулетка: два клика (R)">Рулетка</button>
    <button id="bAddWall">+ Стена</button>
    <button id="bAddWin">+ Окно</button>
    <button id="bAddDoor">+ Дверь</button>
    <button id="bAddBeam" title="Бетонная балка под потолком, колонна, ригель">+ Бетон</button>
    <button id="bAddMeas">+ Замер</button>
    <button id="bUndo" title="Ctrl+Z">↶</button>
    <button id="bRedo" title="Ctrl+Shift+Z">↷</button>
  </div>
</header>
<main>
  <div class="canvas" id="canvas">
    <svg id="plan" aria-label="План квартиры"></svg>
    <div class="zoom"><button id="zIn" aria-label="Приблизить">+</button><button id="zOut" aria-label="Отдалить">−</button><button id="zFit" aria-label="Весь план" style="font-size:12px">▣</button></div>
    <div class="hint" id="hint">Клик — выбрать · тянуть стену — двигать · тянуть пустое место — сдвиг плана · колесо — масштаб · стрелки — сдвиг на 1 мм (Shift — 10 мм)</div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button id="tObj" class="on">Объект</button>
      <button id="tMeas">Замеры А–П</button>
      <button id="tList">Всё</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const svg = $("plan"), canvas = $("canvas"), pane = $("pane");
const mm = v => Math.round(v * 1000);
let unit = "m"; try{ unit = localStorage.getItem("plan-unit-v2") || "m"; }catch(e){}
const UF = {mm:1, cm:10, m:1000}, UN = {mm:"мм", cm:"см", m:"м"};
const toU = v => { if (v == null || v === "" || isNaN(v)) return ""; const f = UF[unit]; const x = v / f; return (unit==="mm" ? String(Math.round(x)) : String(Math.round(x*(unit==="m"?1000:10))/(unit==="m"?1000:10))).replace(".", ","); };
const fromU = s => { const n = parseFloat(String(s).replace(/\s/g,"").replace(",", ".")); return isNaN(n) ? NaN : n * UF[unit]; };
const fmt = v => { if (v == null || isNaN(v)) return "—"; if (unit !== "mm") return (unit==="m" ? (v/1000).toFixed(3) : String(Math.round(v)/10)).replace(".", ","); return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); };
const U = () => UN[unit];
const r4 = v => Math.round(v * 10000) / 10000;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S = null;                 // plan state (meters)
let sel = null;               // {t:'wall'|'win'|'door'|'room'|'meas', id, ri}
let tab = "obj", mode = "select";
let view = {x: -0.5, z: -0.5, k: 60};   // px per meter
let undo = [], redo = [];
let ruler = null;             // {a:{x,z}, b:{x,z}, fixed}
let pendingConfirm = null;
let touchMode = matchMedia("(pointer: coarse)").matches;

// ---------- persistence ----------
let db = null, docRef = null, saveTimer = null, saving = false, lastRev = null, dirty = false, loadTimer = null;
function setStatus(kind, text){ $("dot").className = "dot " + (kind||""); $("statusText").textContent = text; }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }

let lastWalls = {};
function rememberWalls(){ lastWalls = {}; if (S) for (const w of S.walls) lastWalls[w.id] = {x:w.x, z:w.z, w:w.w, h:w.h}; }
function followRooms(){
  // when a wall face moves, room floor edges that sat on that face move with it
  if (!S) return; const e = 0.004;
  for (const w of S.walls){
    const o = lastWalls[w.id]; if (!o || (o.x===w.x && o.z===w.z && o.w===w.w && o.h===w.h)) continue;
    for (const r of S.rooms) for (const q of r.rects){
      const zOver = q[2] < o.z+o.h-e && o.z < q[3]-e, xOver = q[0] < o.x+o.w-e && o.x < q[1]-e;
      if (zOver){ if (Math.abs(q[0]-(o.x+o.w))<e) q[0] = r4(w.x+w.w); else if (Math.abs(q[1]-o.x)<e) q[1] = r4(w.x); }
      if (xOver){ if (Math.abs(q[2]-(o.z+o.h))<e) q[2] = r4(w.z+w.h); else if (Math.abs(q[3]-o.z)<e) q[3] = r4(w.z); }
    }
  }
  rememberWalls();
}
function changed(){ followRooms(); dirty = true; setStatus("busy","Есть изменения…"); clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200); }
async function save(){
  if (!S) return;
  if (saving){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 600); return; }
  if (!docRef){ try{ localStorage.setItem("plan-draft", JSON.stringify(S)); }catch(e){} dirty=false; setStatus("err","Сохранено только в этом браузере"); return; }
  saving = true;
  const rev = Math.random().toString(36).slice(2,10);
  S.rev = rev; S.updatedAt = new Date().toISOString(); lastRev = rev;
  try{ await docRef.set(JSON.parse(JSON.stringify(S))); dirty=false; setStatus("ok","Сохранено " + new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})); }
  catch(e){ setStatus("err", e && e.code === "invalid_argument" ? "Нет прав на запись" : "Не сохранилось, повторю"); if (!(e && e.code==="invalid_argument")) { saveTimer=setTimeout(save,3000); } }
  saving = false;
}
function applyRemote(data){
  if (!data || !Array.isArray(data.walls)) return false;
  S = JSON.parse(JSON.stringify(data)); normalize(); rememberWalls();
  return true;
}
function normalize(){
  S.walls ||= []; S.beams ||= []; S.windows ||= []; S.doors ||= []; S.rooms ||= []; S.meas ||= [];
  S.ceiling ||= {draw:2.7, real:null}; S.notes ??= "";
}
async function initStore(){
  loadTimer = setTimeout(()=>{ if(!S) setStatus("err","План пока не загрузился — проверьте связь"); }, 10000);
  let c = null;
  try{ c = window.claude && await window.claude.use("db"); }catch(e){ c = null; }
  if (!c){
    clearTimeout(loadTimer);
    let local=null; try{ local = JSON.parse(localStorage.getItem("plan-draft")||"null"); }catch(e){}
    if (local && applyRemote(local)){ setStatus("err","Нет связи с хранилищем — правки только в этом браузере"); fit(); renderAll(); }
    else setStatus("err","Хранилище недоступно: откройте страницу на claude.ai, войдя в аккаунт");
    return;
  }
  db = c; docRef = db.doc("plan/current");
  docRef.onSnapshot(snap => {
    if (!snap.exists){ clearTimeout(loadTimer); if(!S) setStatus("err","План ещё не загружен в хранилище"); return; }
    if (snap.metadata.hasPendingWrites) return;
    const data = snap.data();
    if (S && (data.rev === lastRev || dirty || saving)) { if(!snap.metadata.fromCache) clearTimeout(loadTimer); return; }
    const first = !S;
    if (applyRemote(data)){
      if (first) fit();
      if (sel && !findSel()) sel = null;
      renderAll();
      if (!snap.metadata.fromCache){ clearTimeout(loadTimer); setStatus("ok", first ? "План загружен" : "Обновлено из другого окна"); }
    }
  }, err => { clearTimeout(loadTimer); setStatus("err", "Связь с хранилищем потеряна"); });
}

// ---------- undo ----------
function snap(){ undo.push(JSON.stringify(S)); if (undo.length > 200) undo.shift(); redo = []; syncUndo(); }
function doUndo(){ if(!undo.length) return; redo.push(JSON.stringify(S)); S = JSON.parse(undo.pop()); rememberWalls(); if (sel && !findSel()) sel=null; changed(); renderAll(); syncUndo(); }
function doRedo(){ if(!redo.length) return; undo.push(JSON.stringify(S)); S = JSON.parse(redo.pop()); rememberWalls(); if (sel && !findSel()) sel=null; changed(); renderAll(); syncUndo(); }
function syncUndo(){ $("bUndo").disabled = !undo.length; $("bRedo").disabled = !redo.length; }

// ---------- geometry ----------
const coll = t => ({wall:S.walls, beam:S.beams, win:S.windows, door:S.doors, room:S.rooms, meas:S.meas})[t];
function findSel(){ if(!sel) return null; return coll(sel.t).find(o => o.id === sel.id) || null; }
function obstacles(){ return [...S.walls, ...(S.beams||[]).filter(b=>b.kind==="column"||b.kind==="shaft"||b.kind==="pipes"), ...S.windows, ...S.doors]; }
function beamChain(b){
  const r = S.rooms.find(x => x.id === b.room); if (!r) return null;
  const q = r.rects.reduce((a, c) => [Math.min(a[0], c[0]), Math.max(a[1], c[1]), Math.min(a[2], c[2]), Math.max(a[3], c[3])], [1e9, -1e9, 1e9, -1e9]);
  if (b.dir === "h") return {r, q, dir:"h", total:q[1]-q[0], A:b.x-q[0], B:b.w, C:q[1]-(b.x+b.w)};
  return {r, q, dir:"v", total:q[3]-q[2], A:b.z-q[2], B:b.h, C:q[3]-(b.z+b.h)};
}
const BEAM_KIND = {beam:"балка под потолком", column:"колонна / пилон (до пола)", shaft:"вентшахта (вытяжка)", pipes:"трубы / короб с трубами", ledge:"выступ на стене"};
function measEnds(m){
  if (!m.auto) return [m.a0, m.a1];
  let lo = -1e9, hi = 1e9; const c = m.c, mid = m.m, e = 1e-6;
  for (const o of obstacles()){
    if (m.o === "h"){ if (o.z - e <= c && c <= o.z + o.h + e){ if (o.x + o.w <= mid + e) lo = Math.max(lo, o.x + o.w); else if (o.x >= mid - e) hi = Math.min(hi, o.x); } }
    else { if (o.x - e <= c && c <= o.x + o.w + e){ if (o.z + o.h <= mid + e) lo = Math.max(lo, o.z + o.h); else if (o.z >= mid - e) hi = Math.min(hi, o.z); } }
  }
  if (lo < -1e8) lo = mid - 0.5; if (hi > 1e8) hi = mid + 0.5;
  return [lo, hi];
}
function bounds(){
  let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;
  for (const o of obstacles()){ x0=Math.min(x0,o.x); z0=Math.min(z0,o.z); x1=Math.max(x1,o.x+o.w); z1=Math.max(z1,o.z+o.h); }
  if (x0>x1) return {x0:0,z0:0,x1:15,z1:10};
  return {x0,z0,x1,z1};
}
function fit(){
  const r = canvas.getBoundingClientRect(), b = bounds(), pad = 40;
  const k = Math.min((r.width - pad*2) / (b.x1-b.x0), (r.height - pad*2) / (b.z1-b.z0));
  view.k = Math.max(10, k);
  view.x = b.x0 - (r.width/view.k - (b.x1-b.x0))/2;
  view.z = b.z0 - (r.height/view.k - (b.z1-b.z0))/2;
}
const sx = x => (x - view.x) * view.k, sz = z => (z - view.z) * view.k;
function toWorld(ev){ const r = svg.getBoundingClientRect(); return {x: (ev.clientX - r.left)/view.k + view.x, z: (ev.clientY - r.top)/view.k + view.z}; }

// ---------- render ----------
function renderAll(){ renderPlan(); renderPane(); }
function rectFor(t, o, ri){
  if (t === "room"){ const r = o.rects[ri ?? 0]; return {x:r[0], z:r[2], w:r[1]-r[0], h:r[3]-r[2]}; }
  if (t === "meas"){ const [a0,a1] = measEnds(o); return o.o==="h" ? {x:a0, z:o.c, w:a1-a0, h:0} : {x:o.c, z:a0, w:0, h:a1-a0}; }
  return o;
}
function renderPlan(){
  if (!S){ svg.innerHTML = ""; return; }
  const k = view.k, out = [];
  const fs = Math.max(10, Math.min(15, k*0.2));
  out.push(`<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--wall)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--wallhatch)" stroke-width="2"/></pattern><pattern id="conc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" style="fill:var(--wall)" opacity=".55"/><circle cx="2.5" cy="3" r="1.1" style="fill:var(--wallhatch)"/><circle cx="7.5" cy="7.5" r="0.9" style="fill:var(--wallhatch)"/><path d="M6 1.5l1.6 2.6h-3.2z" style="fill:var(--wallhatch)"/></pattern></defs>`);
  // grid 1 m
  const r = canvas.getBoundingClientRect();
  const gx0 = Math.floor(view.x), gx1 = Math.ceil(view.x + r.width/k), gz0 = Math.floor(view.z), gz1 = Math.ceil(view.z + r.height/k);
  let g = "";
  for (let x=gx0; x<=gx1; x++) g += `M${sx(x).toFixed(1)} 0V${r.height}`;
  for (let z=gz0; z<=gz1; z++) g += `M0 ${sz(z).toFixed(1)}H${r.width}`;
  out.push(`<path d="${g}" style="stroke:var(--line)" stroke-width="0.6" fill="none" opacity=".6"/>`);
  // rooms
  for (const rm of S.rooms){
    rm.rects.forEach((q, ri) => {
      out.push(`<rect data-k="room:${rm.id}:${ri}" x="${sx(q[0])}" y="${sz(q[2])}" width="${(q[1]-q[0])*k}" height="${(q[3]-q[2])*k}" style="fill:var(${rm.status==="ok"?"--room":"--room-check"})"/>`);
    });
  }
  // walls
  for (const w of S.walls) out.push(`<rect data-k="wall:${w.id}" x="${sx(w.x)}" y="${sz(w.z)}" width="${Math.max(1,w.w*k)}" height="${Math.max(1,w.h*k)}" fill="url(#${w.mat==="бетон"?"conc":"hatch"})" style="stroke:var(--wallhatch)" stroke-width="${w.mat==="бетон"?1.6:0.8}"/>`);
  // beams / columns
  for (const b of S.beams||[]){
    const x=sx(b.x), y=sz(b.z), W=Math.max(2,b.w*k), H=Math.max(2,b.h*k);
    if (b.kind === "pipes"){
      const hor = b.w >= b.h, d = Math.min(W, H) * 0.62, n = Math.max(1, Math.min(6, Math.floor((hor ? W : H) / (Math.min(W,H)*1.1))));
      out.push(`<g data-k="beam:${b.id}"><rect x="${x}" y="${y}" width="${W}" height="${H}" style="fill:var(--sheet);stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 2"/>`);
      for (let i = 0; i < n; i++){ const cx = hor ? x + W*(i+0.5)/n : x + W/2, cy = hor ? y + H/2 : y + H*(i+0.5)/n; out.push(`<circle cx="${cx}" cy="${cy}" r="${d/2}" fill="none" style="stroke:var(--blue)" stroke-width="1.6"/>`); }
      if (k >= 35) out.push(`<text x="${x+W/2}" y="${y-4}" text-anchor="middle" font-size="10" style="fill:var(--blue);font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px">трубы</text>`);
      out.push(`</g>`);
    } else if (b.kind === "shaft"){
      out.push(`<g data-k="beam:${b.id}"><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="url(#conc)" style="stroke:var(--ink)" stroke-width="1.6"/><line x1="${x}" y1="${y}" x2="${x+W}" y2="${y+H}" style="stroke:var(--ink)" stroke-width="1"/><line x1="${x+W}" y1="${y}" x2="${x}" y2="${y+H}" style="stroke:var(--ink)" stroke-width="1"/>`);
      if (k >= 35) out.push(`<text x="${x+W/2}" y="${y+H/2+4}" text-anchor="middle" font-size="11" style="fill:var(--ink);font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px">вент</text>`);
      out.push(`</g>`);
    } else if (b.kind === "column") out.push(`<rect data-k="beam:${b.id}" x="${x}" y="${y}" width="${W}" height="${H}" fill="url(#conc)" style="stroke:var(--ink)" stroke-width="1.6"/>`);
    else {
      out.push(`<g data-k="beam:${b.id}"><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="url(#conc)" fill-opacity=".45" style="stroke:var(--ink)" stroke-width="1.4" stroke-dasharray="7 4"/>`);
      out.push(`<line x1="${x}" y1="${y}" x2="${x+W}" y2="${y+H}" style="stroke:var(--ink)" stroke-width=".8" stroke-dasharray="4 4"/><line x1="${x+W}" y1="${y}" x2="${x}" y2="${y+H}" style="stroke:var(--ink)" stroke-width=".8" stroke-dasharray="4 4"/>`);
      const ch = beamChain(b);
      if (ch && k >= 30){
        const st = "fill:var(--warn);font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px";
        if (ch.dir === "v"){
          const lx = sx(ch.q[1]) - 8, z0 = ch.q[2], z1 = ch.q[3];
          out.push(`<line x1="${lx}" y1="${sz(z0)}" x2="${lx}" y2="${sz(z1)}" style="stroke:var(--warn)" stroke-width="1.2"/>`);
          for (const zz of [z0, b.z, b.z+b.h, z1]) out.push(`<line x1="${lx-5}" y1="${sz(zz)+5}" x2="${lx+5}" y2="${sz(zz)-5}" style="stroke:var(--warn)" stroke-width="1.5"/>`);
          [[z0,b.z,ch.A],[b.z,b.z+b.h,ch.B],[b.z+b.h,z1,ch.C]].forEach(([a,c,v]) => out.push(`<text x="${lx-6}" y="${(sz(a)+sz(c))/2+4}" text-anchor="end" font-size="11" style="${st}">${fmt(mm(v))}</text>`));
        } else {
          const ly = sz(ch.q[3]) - 8, x0 = ch.q[0], x1 = ch.q[1];
          out.push(`<line x1="${sx(x0)}" y1="${ly}" x2="${sx(x1)}" y2="${ly}" style="stroke:var(--warn)" stroke-width="1.2"/>`);
          for (const xx of [x0, b.x, b.x+b.w, x1]) out.push(`<line x1="${sx(xx)-5}" y1="${ly+5}" x2="${sx(xx)+5}" y2="${ly-5}" style="stroke:var(--warn)" stroke-width="1.5"/>`);
          [[x0,b.x,ch.A],[b.x,b.x+b.w,ch.B],[b.x+b.w,x1,ch.C]].forEach(([a,c,v]) => out.push(`<text x="${(sx(a)+sx(c))/2}" y="${ly-6}" text-anchor="middle" font-size="11" style="${st}">${fmt(mm(v))}</text>`));
        }
      }
      if (k >= 35){ const t = b.drop ? `бетон −${fmt(b.drop)}` : "бетон"; out.push(`<text x="${x+W/2}" y="${y+H/2+4}" text-anchor="middle" font-size="11" style="fill:var(--ink);font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px">${t}</text>`); }
      out.push(`</g>`);
    }
  }
  if (touchMode) for (const w of S.walls){ const W = w.w*k, H = w.h*k, px = Math.max(0, (18 - W)/2), pz = Math.max(0, (18 - H)/2); if (px || pz) out.push(`<rect data-k="wall:${w.id}" x="${sx(w.x)-px}" y="${sz(w.z)-pz}" width="${W+2*px}" height="${H+2*pz}" fill="transparent"/>`); }
  // windows
  for (const o of S.windows){
    const x=sx(o.x), y=sz(o.z), W=o.w*k, H=o.h*k, hor = o.w >= o.h;
    out.push(`<g data-k="win:${o.id}"><rect x="${x}" y="${y}" width="${W}" height="${H}" style="fill:var(--sheet);stroke:var(--ink)" stroke-width="1"/>`);
    out.push(hor ? `<line x1="${x}" y1="${y+H/2}" x2="${x+W}" y2="${y+H/2}" style="stroke:var(--ink)" stroke-width="1"/>` : `<line x1="${x+W/2}" y1="${y}" x2="${x+W/2}" y2="${y+H}" style="stroke:var(--ink)" stroke-width="1"/>`);
    out.push(`</g>`);
  }
  // doors
  for (const o of S.doors){
    const x=sx(o.x), y=sz(o.z), W=Math.max(2,o.w*k), H=Math.max(2,o.h*k);
    out.push(`<rect data-k="door:${o.id}" x="${x}" y="${y}" width="${W}" height="${H}" style="fill:var(--blue-soft);stroke:var(--blue)" stroke-width="1" stroke-dasharray="4 3"/>`);
  }
  // room labels with live size
  for (const rm of S.rooms){
    const q = rm.rects[0]; const lx = sx(rm.label?.[0] ?? (q[0]+q[1])/2), ly = sz(rm.label?.[1] ?? (q[2]+q[3])/2);
    const area = rm.rects.reduce((a,q)=>a+(q[1]-q[0])*(q[3]-q[2]),0);
    out.push(`<g data-k="room:${rm.id}:0" style="cursor:pointer"><text x="${lx}" y="${ly}" text-anchor="middle" font-size="${fs+1}" font-weight="600" style="fill:var(--ink);font-family:var(--sans)">${rm.num}. ${esc(rm.name)}</text>`);
    if (k >= 45) out.push(`<text x="${lx}" y="${ly+fs+3}" text-anchor="middle" font-size="${fs-1}" style="fill:var(${rm.status==="ok"?"--muted":"--warn"});font-family:var(--mono)">${rm.rects.length > 1 ? "" : `${fmt(mm(q[1]-q[0]))}×${fmt(mm(q[3]-q[2]))} · `}${area.toFixed(2).replace(".",",")} м²</text></g>`);
  }
  // measurement lines
  for (const m of S.meas){
    const [a0,a1] = measEnds(m); const isSel = sel && sel.t==="meas" && sel.id===m.id;
    const col = isSel ? "--sel" : "--blue";
    let x1,y1,x2,y2;
    if (m.o==="h"){ x1=sx(a0); x2=sx(a1); y1=y2=sz(m.c); } else { y1=sz(a0); y2=sz(a1); x1=x2=sx(m.c); }
    const t = 6, tick = (x,y)=>`<line x1="${x-t}" y1="${y+t}" x2="${x+t}" y2="${y-t}" style="stroke:var(${col})" stroke-width="2"/>`;
    const fr = m.fr ?? 0.5;
    const cx = m.o==="h" ? x1 + (x2-x1)*fr : x1, cy = m.o==="h" ? y1 : y1 + (y2-y1)*fr;
    const draw = mm(a1-a0), real = m.real, diff = real ? real - draw : null;
    out.push(`<g data-k="meas:${m.id}" style="cursor:move"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(${col})" stroke-width="10" opacity="0"/>`);
    out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(${col})" stroke-width="${isSel?2.5:1.6}"/>${tick(x1,y1)}${tick(x2,y2)}`);
    const R = Math.max(9, Math.min(14, k*0.17));
    out.push(`<circle cx="${cx}" cy="${cy}" r="${R}" style="fill:var(${col})"/><text x="${cx}" y="${cy+R*0.38}" text-anchor="middle" font-size="${R*1.1}" font-weight="700" fill="#fff" style="font-family:var(--sans)">${esc(m.L)}</text>`);
    const lbl = real ? `${fmt(real)}${Math.abs(diff)>5?` (${diff>0?"+":""}${fmt(diff)})`:""}` : fmt(draw);
    const lc = real ? (Math.abs(diff)>10 ? "--bad" : "--ok") : col;
    if (k < 35 && !isSel && !real) {} else if (m.o==="h") out.push(`<text x="${cx + R + 4}" y="${cy - 5}" font-size="${fs-1}" style="fill:var(${lc});font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px">${lbl}</text>`);
    else out.push(`<text x="${cx + R + 4}" y="${cy + 4}" font-size="${fs-1}" style="fill:var(${lc});font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px">${lbl}</text>`);
    out.push(`</g>`);
  }
  // selection
  const o = findSel();
  if (o && sel.t !== "meas"){
    const q = rectFor(sel.t, o, sel.ri), x=sx(q.x), y=sz(q.z), W=q.w*k, H=q.h*k;
    out.push(`<rect x="${x-2}" y="${y-2}" width="${W+4}" height="${H+4}" fill="none" style="stroke:var(--sel)" stroke-width="2"/>`);
    const hs = touchMode ? 18 : 9, hd = [["w",x,y+H/2],["e",x+W,y+H/2],["n",x+W/2,y],["s",x+W/2,y+H]];
    for (const [h,hx,hy] of hd) out.push(`<rect data-h="${h}" x="${hx-hs/2}" y="${hy-hs/2}" width="${hs}" height="${hs}" style="fill:var(--sheet);stroke:var(--sel);cursor:${h==="w"||h==="e"?"ew-resize":"ns-resize"}" stroke-width="2"/>`);
    // dimension readout
    const lab = `${fmt(mm(q.w))} × ${fmt(mm(q.h))}`;
    out.push(`<text x="${x+W/2}" y="${y-10}" text-anchor="middle" font-size="12" style="fill:var(--sel);font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px">${lab}</text>`);
  }
  // ruler
  if (ruler && ruler.a){
    const b = ruler.b || ruler.a, x1=sx(ruler.a.x), y1=sz(ruler.a.z), x2=sx(b.x), y2=sz(b.z);
    const dx = mm(Math.abs(b.x-ruler.a.x)), dz = mm(Math.abs(b.z-ruler.a.z)), L = Math.round(Math.hypot(dx,dz));
    out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--sel)" stroke-width="2" stroke-dasharray="6 4"/>`);
    out.push(`<circle cx="${x1}" cy="${y1}" r="4" style="fill:var(--sel)"/><circle cx="${x2}" cy="${y2}" r="4" style="fill:var(--sel)"/>`);
    const t = dx && dz ? `${fmt(L)}  (↔${fmt(dx)} ↕${fmt(dz)})` : fmt(L);
    out.push(`<text x="${(x1+x2)/2 + 8}" y="${(y1+y2)/2 - 8}" font-size="14" font-weight="600" style="fill:var(--sel);font-family:var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:4px">${t} ${U()}</text>`);
  }
  if (ruler && ruler.snap){ out.push(`<circle cx="${sx(ruler.snap.x)}" cy="${sz(ruler.snap.z)}" r="6" fill="none" style="stroke:var(--sel)" stroke-width="1.5"/>`); }
  // scale bar
  out.push(`<g transform="translate(${r.width-140},${r.height-24})"><line x1="0" y1="0" x2="${k}" y2="0" style="stroke:var(--ink)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" style="stroke:var(--ink)"/><line x1="${k}" y1="-4" x2="${k}" y2="4" style="stroke:var(--ink)"/><text x="${k/2}" y="-6" text-anchor="middle" font-size="11" style="fill:var(--muted);font-family:var(--mono)">1 м</text></g>`);
  svg.innerHTML = out.join("");
  refreshCalc();
}

// ---------- side pane ----------
function unitSwitch(){
  return `<div class="useg" role="group" aria-label="Единицы">${["m","cm","mm"].map(u=>`<button type="button" data-unit="${u}" class="${unit===u?"on":""}">${UN[u]}</button>`).join("")}</div>`;
}
function setUnit(u){ unit = u; try{ localStorage.setItem("plan-unit-v2", unit); }catch(_){} $("unitSel").value = unit; renderAll(); }
function field(label, key, val, opts={}){
  const isText = opts.type === "text", plain = opts.plain;
  const shown = isText || plain ? (val ?? "") : toU(val);
  return `<label class="f">${label}${!isText&&!plain?`, ${U()}`:""}<input data-f="${key}" type="text" ${!isText?'inputmode="decimal"':""} value="${esc(shown)}" ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}></label>`;
}
function renderPane(){
  ["obj","meas","list"].forEach(t => $("t"+t[0].toUpperCase()+t.slice(1)).classList.toggle("on", tab===t));
  if (!S){ pane.innerHTML = `<p class="empty">План загружается. Если он не появится, страницу нужно открыть на claude.ai, войдя в аккаунт.</p>`; return; }

  if (tab === "list") return renderListPane();
  const o = findSel();

  let h = "";
  const confirmBox = pendingConfirm ? `<div class="confirm">Удалить этот объект? <div class="row"><button id="cYes" class="danger">Удалить</button><button id="cNo">Отмена</button></div></div>` : "";
  if (sel.t === "wall" || sel.t === "win" || sel.t === "door" || sel.t === "beam"){
    const title = {wall:"Стена", win:"Окно", door:"Дверь / проём", beam:"Бетон"}[sel.t];
    const hor = o.w >= o.h;
    h += `<h2>${title}</h2><h3>${sel.t==="door"?esc(o.name||"дверь"):title} <span class="calc" style="color:var(--muted);font-size:12px">${o.id}</span></h3>`;
    h += `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 8px"><span class="sub" style="margin:0">${hor?"Горизонтальная — длина слева направо":"Вертикальная — длина сверху вниз"}</span>${unitSwitch()}</div>`;
    h += `<div class="grid2">${hor ? field("Длина","w",mm(o.w))+field("Толщина","h",mm(o.h)) : field("Длина","h",mm(o.h))+field("Толщина","w",mm(o.w))}</div>`;
    h += `<p class="sub" style="margin-top:6px">При изменении длины ${hor?"левый":"верхний"} конец стоит на месте, двигается ${hor?"правый":"нижний"}.</p>`;
    h += `<p class="sub" style="margin:12px 0 6px">Положение (от левого верхнего угла плана)</p><div class="grid2">${field("X, левый край","x",mm(o.x))}${field("Y, верхний край","z",mm(o.z))}</div>`;
    h += `<p class="sub calc" style="margin-top:8px">правый край ${fmt(mm(o.x+o.w))} · нижний край ${fmt(mm(o.z+o.h))}</p>`;
    if (sel.t === "wall") h += `<label class="f" style="margin-top:12px">Материал<select data-f="mat">${["","бетон","кирпич","газоблок","ГКЛ"].map(m=>`<option value="${m}" ${(o.mat||"")===m?"selected":""}>${m||"не указан"}</option>`).join("")}</select></label>`;

      if (o.kind === "beam"){

        h += `<div class="confirm" style="background:var(--blue-soft);border-color:var(--blue);margin-top:12px"><b>Поставить балку поперёк комнаты по размерам</b>

        <label class="f">Считать от<select id="chDir"><option value="v" ${o.dir!=="h"?"selected":""}>верхней стены ↓</option><option value="h" ${o.dir==="h"?"selected":""}>левой стены →</option></select></label>

      }
      h += `<label class="f" style="margin-top:8px">Пометка<input data-f="note" type="text" value="${esc(o.note||"")}" placeholder="например: монолит, сверлить нельзя"></label>`;
    }
    if (sel.t === "door") h += `<div class="grid2">${field("Название","name",o.name,{type:"text"})}${field("Высота проёма","hh",mm(o.hh||2.1))}${field("Замер ширины","real",o.real,{ph:U()})}<label class="f">Тип<select data-f="type">${["std","neo","open","entry","glass"].map(t=>`<option ${o.type===t?"selected":""}>${t}</option>`).join("")}</select></label></div>`;
    if (sel.t === "win") h += `<div class="grid2">${field("Подоконник от пола","sill",mm(o.sill||0.8))}${field("Верх окна от пола","top",mm(o.top||2.4))}${field("Замер ширины","real",o.real,{ph:U()})}</div>`;

  } else if (sel.t === "room"){
    h += `<h2>Помещение</h2><div class="grid2">${field("Название","name",o.name,{type:"text"})}${field("Номер","num",o.num,{plain:true})}</div>`;
    h += `<label class="f" style="margin-top:8px">Статус<select data-f="status"><option value="check" ${o.status!=="ok"?"selected":""}>проверить замером</option><option value="ok" ${o.status==="ok"?"selected":""}>подтверждено</option></select></label>`;
    h += `<p class="sub" style="margin-top:12px">Пол помещения — один или несколько прямоугольников (лево, право, верх, низ).</p>`;
    o.rects.forEach((q,i)=>{
      h += `<div style="margin-bottom:10px;${sel.ri===i?"":"opacity:.75"}"><div class="sub" style="margin:0 0 4px">Прямоугольник ${i+1} · <span class="calc">${fmt(mm(q[1]-q[0]))} × ${fmt(mm(q[3]-q[2]))}</span> ${o.rects.length>1?`<button data-delrect="${i}" class="danger" style="padding:1px 6px;font-size:11px">убрать</button>`:""}</div>
      <div class="grid2">${field("Лево","r"+i+"_0",mm(q[0]))}${field("Право","r"+i+"_1",mm(q[1]))}${field("Верх","r"+i+"_2",mm(q[2]))}${field("Низ","r"+i+"_3",mm(q[3]))}</div></div>`;
    });
    h += `<div class="row"><button id="aAddRect">+ прямоугольник</button><button id="aFitRoom" title="Подогнать прямоугольник 1 к ближайшим стенам">Прижать к стенам</button></div>`;

function applyBoxHtml(o, draw){

function nudge(dir, stepMm){

function refreshCalc(){
  if (!S) return;
  for (const m of S.meas){
    const [a0,a1]=measEnds(m), draw=mm(a1-a0);
    const c = pane.querySelector(`[data-calc="${m.id}"]`); if (c) c.textContent = fmt(draw);
    const cv = pane.querySelector(`[data-calcv="${m.id}"]`); if (cv && document.activeElement !== cv) cv.value = toU(draw);
    const d = pane.querySelector(`[data-diff="${m.id}"]`);
    if (d){ if (m.real){ const df = m.real-draw; d.textContent = df === 0 ? "✓ совпадает" : (df>0?"+":"")+fmt(df); d.className = "d " + (Math.abs(df)>10?"bad":"ok"); } else { d.textContent=""; d.className="d"; } }
  }
  const s = pane.querySelector('[data-calc="sel"]'); const o = findSel();
  if (s && o && sel.t==="meas" && document.activeElement !== s){ const [a0,a1]=measEnds(o); s.value = toU(mm(a1-a0)); }
}
let typingSnap = false;
function bindPane(){
  pane.querySelectorAll("input,select,textarea").forEach(el => el.addEventListener("focus", ()=>{ typingSnap = false; }));
  const before = () => { if (!typingSnap){ snap(); typingSnap = true; } };
  pane.querySelectorAll("[data-f]").forEach(el => {
    const ev = el.tagName==="SELECT"||el.type==="checkbox"||el.dataset.f==="len" ? "change" : "input";
    el.addEventListener(ev, () => {
      const o = findSel(); if (!o) return; const f = el.dataset.f; before();
      let v = el.type==="checkbox" ? el.checked : el.value;
      if (f==="len"){ const n = fromU(v); if (isNaN(n) || n <= 0){ refreshCalc(); return; } applyLength(o, Math.round(n), o.side==="start"?"start":"end"); return; }
      if (/^r\d+_\d$/.test(f)){ const [ri,ci] = f.slice(1).split("_").map(Number); const n = fromU(v); if (isNaN(n)) return; o.rects[ri][ci] = r4(n/1000); }

      else if (f==="real" || f==="drop"){ const n = fromU(v); o[f] = isNaN(n) ? null : Math.round(n); }
      else if (f==="num"){ const n = parseInt(v); if(!isNaN(n)) o.num = n; }
      else if (f==="auto"){ if (!v){ const [a0,a1]=measEnds(o); o.a0=r4(a0); o.a1=r4(a1); } else { o.m = r4(((o.a0??0)+(o.a1??0))/2); } o.auto = v; }
      else o[f] = v;
      changed(); renderPlan();
      if (f==="auto"||f==="o"||f==="status"||f==="side"||f==="kind") { const id=el.dataset.f; renderPane(); const again = pane.querySelector(`[data-f="${id}"]`); if (again && again.type!=="checkbox" && again.tagName!=="SELECT") { again.focus(); try{ const L=again.value.length; again.setSelectionRange(L,L); }catch(e){} } }
    });

    applyLength(m, Math.round(n), m.side==="start"?"start":"end");

  pane.querySelectorAll("[data-mside]").forEach(el => el.addEventListener("click", () => {
    const m = S.meas.find(x=>x.id===el.dataset.mside); snap(); m.side = m.side==="start" ? "end" : "start"; changed();
    el.textContent = m.o==="h" ? (m.side==="start"?"←":"→") : (m.side==="start"?"↑":"↓");
  }));
  const bulk = (apply) => {
    const txt = $("bulk").value; const re = /([А-ЯЁа-яёA-Za-z])\s*[:=\-–]?\s*(\d+(?:[.,]\d+)?)/g; let mt, items = [], unknown = [];
    while ((mt = re.exec(txt))){ const L = mt[1].toUpperCase(); const m = S.meas.find(x => x.L.toUpperCase() === L); const n = fromU(mt[2]); if (!m) unknown.push(L); else if (!isNaN(n) && n > 0) items.push([m, Math.round(n)]); }

    if (bad.length) parts.push(`не подогнать (с той стороны не стена): ${bad.join(", ")}`); if (unknown.length) parts.push(`нет таких букв: ${unknown.join(", ")}`);

  on("aReset", () => { pendingConfirm = "reset"; renderPane(); });
  on("rNo", () => { pendingConfirm = null; renderPane(); });
  on("rYes", async () => { pendingConfirm = null; if (!db){ toast("Хранилище недоступно"); return; } try{ const s = await db.doc("plan/original").get(); if (!s.exists){ toast("Исходник не найден"); renderPane(); return; } snap(); S = JSON.parse(JSON.stringify(s.data())); normalize(); rememberWalls(); sel=null; changed(); renderAll(); toast("Исходный план возвращён"); }catch(e){ toast("Не получилось загрузить исходник"); } });
  const ce = $("ceilReal"); if (ce) ce.addEventListener("input", () => { before(); const n=fromU(ce.value); S.ceiling.real = isNaN(n)?null:Math.round(n); changed(); });
  const nt = $("notes"); if (nt) nt.addEventListener("input", () => { before(); S.notes = nt.value; changed(); });
}
function newId(t){ const p = {wall:"w",beam:"b",win:"o",door:"d",meas:"m",room:"r"}[t]; let i = coll(t).length+1; while (coll(t).some(o=>o.id===p+i)) i++; return p+i; }
function fitRoomRect(o, ri){
  const q = o.rects[ri], cx=(q[0]+q[1])/2, cz=(q[2]+q[3])/2;
  const h = measEnds({auto:true,o:"h",c:cz,m:cx}), v = measEnds({auto:true,o:"v",c:cx,m:cz});
  o.rects[ri] = [r4(h[0]),r4(h[1]),r4(v[0]),r4(v[1])];
}
function applyReal(m, side){ if (m && m.real) applyLength(m, m.real, side); }
function applyLength(m, target, side, quiet){
  const [a0,a1] = measEnds(m), delta = target/1000 - (a1-a0);
  if (Math.abs(delta) < 0.0005){ if(!quiet) refreshCalc(); return "same"; }
  const H = m.o==="h", e = 0.002;
  const P = o => H ? o.x : o.z, L = o => H ? o.w : o.h;          // position / length along the line
  const inBand = o => H ? (o.z-1e-6<=m.c && m.c<=o.z+o.h+1e-6) : (o.x-1e-6<=m.c && m.c<=o.x+o.w+1e-6);
  const cross = (a,b) => H ? (a.z < b.z+b.h && b.z < a.z+a.h) : (a.x < b.x+b.w && b.x < a.x+a.w);
  const atEnd = side === "end";
  const face = atEnd ? a1 : a0;
  const hit = S.walls.filter(o => inBand(o) && Math.abs((atEnd ? P(o) : P(o)+L(o)) - face) < e);
  if (!hit.length){ if (!quiet){ toast("С этой стороны не стена (дверь или окно) — выберите другую сторону"); refreshCalc(); } return "nowall"; }
  if (!quiet) snap();
  const set = (o, p, l) => { if (H){ o.x = r4(p); o.w = r4(l); } else { o.z = r4(p); o.h = r4(l); } };
  let resized = 0;
  for (const w of hit){
    const far = atEnd ? P(w)+L(w) : P(w);
    const attached = obstacles().some(o => o !== w && cross(o, w) && Math.abs((atEnd ? P(o) : P(o)+L(o)) - far) < 0.015);
    const nl = L(w) - delta;
    if (attached && nl > 0.005){ resized++; if (atEnd) set(w, P(w)+delta, nl); else set(w, P(w), nl); }
    else { if (atEnd) set(w, P(w)+delta, L(w)); else set(w, P(w)-delta, L(w)); }
  }
  if (!m.auto){ if (atEnd) m.a1 = r4(m.a1 + delta); else m.a0 = r4(m.a0 - delta); }
  if (quiet) return "ok";
  changed(); renderAll();
  toast(resized ? `Выступ изменён на ${fmt(-delta*1000)} ${U()}` : `Стена сдвинута на ${fmt(delta*1000)} ${U()}`);
}
function centerOn(o){
  if (!o) return; const q = rectFor(sel.t, o, sel.ri); const r = canvas.getBoundingClientRect();
  const cx = q.x + q.w/2, cz = q.z + q.h/2; view.x = cx - r.width/2/view.k; view.z = cz - r.height/2/view.k;
}

// ---------- pointer interaction ----------
const pts = new Map(); let drag = null, pinch = null;
function snapPoints(){
  const arr = [];
  for (const o of obstacles()) arr.push({x:o.x,z:o.z},{x:o.x+o.w,z:o.z},{x:o.x,z:o.z+o.h},{x:o.x+o.w,z:o.z+o.h});
  return arr;
}
function snapRuler(p){
  const tol = 10 / view.k; let best=null, bd=tol;
  for (const s of snapPoints()){ const d = Math.hypot(s.x-p.x, s.z-p.z); if (d < bd){ bd=d; best=s; } }
  if (best) return {p:best, snap:best};
  // edge snap: to wall faces
  let x=p.x, z=p.z, snapped=false;
  for (const o of obstacles()){
    if (p.z>=o.z-tol && p.z<=o.z+o.h+tol){ for (const ex of [o.x,o.x+o.w]) if (Math.abs(ex-p.x)<tol){ x=ex; snapped=true; } }
    if (p.x>=o.x-tol && p.x<=o.x+o.w+tol){ for (const ez of [o.z,o.z+o.h]) if (Math.abs(ez-p.z)<tol){ z=ez; snapped=true; } }
  }
  return {p:{x,z}, snap: snapped?{x,z}:null};
}
function edgeSnap(val, axis, selfId){
  const tol = 6 / view.k; let best = val, bd = tol;
  for (const o of obstacles()){ if (o.id === selfId) continue; const es = axis==="x" ? [o.x, o.x+o.w] : [o.z, o.z+o.h]; for (const e of es){ const d=Math.abs(e-val); if (d<bd){ bd=d; best=e; } } }
  return best;
}
svg.addEventListener("pointerdown", ev => {
  svg.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pts.size === 2){ const [a,b] = [...pts.values()]; pinch = {d: Math.hypot(a.x-b.x,a.y-b.y), k: view.k, cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, vx:view.x, vz:view.z}; drag=null; return; }
  if (!S) return;
  const w = toWorld(ev);
  if (mode === "ruler"){
    const s = snapRuler(w).p;
    if (!ruler || ruler.fixed || !ruler.a) ruler = {a:s, b:null, fixed:false};
    else { ruler.b = s; ruler.fixed = true; }
    renderPlan(); return;
  }
  const hEl = ev.target.closest("[data-h]");
  if (hEl && findSel()){
    drag = {kind:"handle", h:hEl.dataset.h, start:w, orig: JSON.parse(JSON.stringify(findSel())), moved:false}; return;
  }
  const el = ev.target.closest("[data-k]");
  if (el){
    const [t,id,ri] = el.dataset.k.split(":");
    const changedSel = !sel || sel.t!==t || sel.id!==id || (t==="room" && sel.ri!==+ri);
    sel = {t, id, ri: ri ? +ri : 0}; pendingConfirm = null;
    if (t !== "room" && !(ev.pointerType === "touch" && changedSel)) drag = {kind:"move", start:w, orig: JSON.parse(JSON.stringify(findSel())), moved:false};
    else drag = {kind:"pan", sx:ev.clientX, sy:ev.clientY, vx:view.x, vz:view.z, moved:false, clickRoom:true};
    if (tab === "list") tab = "obj";
    if (changedSel){ renderPlan(); if (tab!=="meas" || t!=="meas") { if (tab==="meas" && t!=="meas") tab="obj"; renderPane(); } else renderPane(); }
    return;
  }
  drag = {kind:"pan", sx:ev.clientX, sy:ev.clientY, vx:view.x, vz:view.z, moved:false};
});
svg.addEventListener("pointermove", ev => {
  if (pts.has(ev.pointerId)) pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pinch && pts.size === 2){
    const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y); const r = svg.getBoundingClientRect();
    const k = Math.max(8, Math.min(800, pinch.k * d / pinch.d));
    const wx = (pinch.cx - r.left)/pinch.k + pinch.vx, wz = (pinch.cy - r.top)/pinch.k + pinch.vz;
    const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
    view.k = k; view.x = wx - (cx - r.left)/k; view.z = wz - (cy - r.top)/k; renderPlan(); return;
  }
  if (!S) return;
  if (mode === "ruler"){
    const s = snapRuler(toWorld(ev));
    if (ruler && ruler.a && !ruler.fixed){ ruler.b = s.p; }
    ruler = ruler || {}; ruler.snap = s.snap; renderPlan(); return;
  }
  if (!drag) return;
  if (drag.kind === "pan"){
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy; if (Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx - dx/view.k; view.z = drag.vz - dy/view.k; renderPlan(); return;
  }
  const w = toWorld(ev), dx = w.x - drag.start.x, dz = w.z - drag.start.z;
  if (!drag.moved && Math.hypot(dx,dz)*view.k < 4) return;
  if (!drag.moved){ snap(); drag.moved = true; }
  const o = findSel(), g = drag.orig, step = 0.005;
  const q5 = v => Math.round(v/step)*step;
  if (drag.kind === "move"){
    if (sel.t === "meas"){
      if (o.o==="h"){ o.c = r4(q5(g.c + dz)); if (o.auto) o.m = r4(g.m + dx); else { o.a0=r4(q5(g.a0+dx)); o.a1=r4(q5(g.a1+dx)); } }
      else { o.c = r4(q5(g.c + dx)); if (o.auto) o.m = r4(g.m + dz); else { o.a0=r4(q5(g.a0+dz)); o.a1=r4(q5(g.a1+dz)); } }
    } else {
      let nx = q5(g.x + dx), nz = q5(g.z + dz);
      if (!ev.altKey){
        const sx1 = edgeSnap(nx,"x",o.id), sx2 = edgeSnap(nx+g.w,"x",o.id)-g.w; nx = Math.abs(sx1-nx) <= Math.abs(sx2-nx) ? (sx1!==nx?sx1:sx2) : sx2;
        const sz1 = edgeSnap(nz,"z",o.id), sz2 = edgeSnap(nz+g.h,"z",o.id)-g.h; nz = Math.abs(sz1-nz) <= Math.abs(sz2-nz) ? (sz1!==nz?sz1:sz2) : sz2;
      }
      o.x = r4(nx); o.z = r4(nz);
    }
  } else if (drag.kind === "handle"){
    if (sel.t === "room"){
      const q = o.rects[sel.ri||0], gq = g.rects[sel.ri||0];
      if (drag.h==="w") q[0] = r4(edgeSnap(q5(gq[0]+dx),"x")); if (drag.h==="e") q[1] = r4(edgeSnap(q5(gq[1]+dx),"x"));
      if (drag.h==="n") q[2] = r4(edgeSnap(q5(gq[2]+dz),"z")); if (drag.h==="s") q[3] = r4(edgeSnap(q5(gq[3]+dz),"z"));
    } else {
      if (drag.h==="e") o.w = r4(Math.max(0.005, edgeSnap(q5(g.x+g.w+dx),"x",o.id) - g.x));
      if (drag.h==="s") o.h = r4(Math.max(0.005, edgeSnap(q5(g.z+g.h+dz),"z",o.id) - g.z));
      if (drag.h==="w"){ const nx = Math.min(g.x+g.w-0.005, edgeSnap(q5(g.x+dx),"x",o.id)); o.w = r4(g.x+g.w-nx); o.x = r4(nx); }
      if (drag.h==="n"){ const nz = Math.min(g.z+g.h-0.005, edgeSnap(q5(g.z+dz),"z",o.id)); o.h = r4(g.z+g.h-nz); o.z = r4(nz); }
    }
  }
  renderPlan(); syncPaneValues();
});
function endPtr(ev){
  pts.delete(ev.pointerId); if (pts.size < 2) pinch = null;
  if (!drag) return;
  if (drag.kind==="pan" && !drag.moved && !drag.clickRoom && sel){ sel = null; pendingConfirm=null; renderAll(); }
  else if (drag.kind==="pan" && drag.clickRoom && !drag.moved){ /* room selected */ }
  if (drag.moved && drag.kind!=="pan"){ changed(); renderPane(); }
  drag = null;
}
svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
function syncPaneValues(){
  const o = findSel(); if (!o) return;
  pane.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f; if (document.activeElement === el) return;
    if (/^r\d+_\d$/.test(f)){ const [ri,ci] = f.slice(1).split("_").map(Number); if (o.rects?.[ri]) el.value = toU(mm(o.rects[ri][ci])); }
    else if (["x","z","w","h","c","a0","a1"].includes(f) && o[f]!=null) el.value = toU(mm(o[f]));
  });
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault(); const r = svg.getBoundingClientRect();
  const w = {x:(ev.clientX-r.left)/view.k+view.x, z:(ev.clientY-r.top)/view.k+view.z};
  view.k = Math.max(8, Math.min(800, view.k * Math.exp(-ev.deltaY*0.0015)));
  view.x = w.x - (ev.clientX-r.left)/view.k; view.z = w.z - (ev.clientY-r.top)/view.k; renderPlan();
}, {passive:false});
function zoomBy(f){ const r = canvas.getBoundingClientRect(); const cx=view.x+r.width/2/view.k, cz=view.z+r.height/2/view.k; view.k=Math.max(8,Math.min(800,view.k*f)); view.x=cx-r.width/2/view.k; view.z=cz-r.height/2/view.k; renderPlan(); }
$("zIn").onclick = () => zoomBy(1.3); $("zOut").onclick = () => zoomBy(1/1.3); $("zFit").onclick = () => { if(S){ fit(); renderPlan(); } };

// ---------- toolbar ----------
function setMode(m){ mode = m; $("bSelect").classList.toggle("on", m==="select"); $("bRuler").classList.toggle("on", m==="ruler"); ruler = null;
  $("hint").textContent = touchMode ? (m==="ruler" ? "Рулетка: коснитесь первой точки, затем второй." : "Коснитесь элемента, чтобы выбрать. Выбранный можно тянуть пальцем; два пальца — масштаб.") : m==="ruler" ? "Рулетка: кликните первую точку, затем вторую. Точки прилипают к углам и граням стен. Esc — выйти." : "Клик — выбрать · тянуть стену — двигать (Alt — без прилипания) · тянуть пустое место — сдвиг плана · колесо — масштаб · стрелки — 1 мм (Shift — 10 мм)";
  svg.style.cursor = m==="ruler" ? "crosshair" : ""; renderPlan(); }
$("bSelect").onclick = () => setMode("select"); $("bRuler").onclick = () => setMode(mode==="ruler"?"select":"ruler");
function viewCenter(){ const r = canvas.getBoundingClientRect(); return {x: view.x + r.width/2/view.k, z: view.z + r.height/2/view.k}; }
function addItem(t, o){ if(!S) return; snap(); o.id = newId(t); coll(t).push(o); sel = {t, id:o.id}; tab="obj"; setMode("select"); changed(); renderAll(); toast("Добавлено — подвиньте на место"); }
$("bAddWall").onclick = () => { const c = viewCenter(); addItem("wall", {x:r4(c.x-0.5), z:r4(c.z), w:1, h:0.12}); };
$("bAddWin").onclick = () => { const c = viewCenter(); addItem("win", {x:r4(c.x-0.6), z:r4(c.z), w:1.2, h:0.27, sill:0.8, top:2.4, real:null}); };
$("bAddBeam").onclick = () => { const c = viewCenter(); addItem("beam", {x:r4(c.x-1), z:r4(c.z-0.1), w:2, h:0.25, kind:"beam", drop:300, note:""}); };
$("bAddDoor").onclick = () => { const c = viewCenter(); addItem("door", {x:r4(c.x-0.4), z:r4(c.z), w:0.8, h:0.12, name:"новая дверь", type:"std", hh:2.1, real:null}); };
$("bAddMeas").onclick = () => { const c = viewCenter(); const used = new Set(S.meas.map(m=>m.L)); const L = "РСТУФХЦЧШЭЮЯ".split("").find(l=>!used.has(l)) || "?"; addItem("meas", {L, room:"", o:"h", c:r4(c.z), m:r4(c.x), a0:r4(c.x-1), a1:r4(c.x+1), auto:true, fr:0.5, note:"", real:null}); };
$("bUndo").onclick = doUndo; $("bRedo").onclick = doRedo;
$("tObj").onclick = () => { tab="obj"; pendingConfirm=null; renderPane(); };
$("tMeas").onclick = () => { tab="meas"; pendingConfirm=null; renderPane(); };
$("tList").onclick = () => { tab="list"; pendingConfirm=null; renderPane(); };
document.addEventListener("keydown", ev => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
  if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="z" && !inField){ ev.preventDefault(); ev.shiftKey ? doRedo() : doUndo(); return; }
  if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="y" && !inField){ ev.preventDefault(); doRedo(); return; }
  if (inField) return;
  if (ev.key === "Escape"){ if (mode==="ruler") setMode("select"); else { sel=null; pendingConfirm=null; renderAll(); } return; }
  if (ev.key === "r" || ev.key === "к"){ setMode(mode==="ruler"?"select":"ruler"); return; }
  if (ev.key === "v" || ev.key === "м"){ setMode("select"); return; }
  const o = findSel(); if (!o || sel.t==="room") return;
  if (ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); pendingConfirm="del"; tab="obj"; renderPane(); return; }
  const st = ev.shiftKey ? 0.01 : 0.001; let dx=0, dz=0;
  if (ev.key==="ArrowLeft") dx=-st; else if (ev.key==="ArrowRight") dx=st; else if (ev.key==="ArrowUp") dz=-st; else if (ev.key==="ArrowDown") dz=st; else return;
  ev.preventDefault(); snap();
  if (sel.t==="meas"){ if (o.o==="h"){ o.c=r4(o.c+dz); if(o.auto) o.m=r4(o.m+dx); else {o.a0=r4(o.a0+dx);o.a1=r4(o.a1+dx);} } else { o.c=r4(o.c+dx); if(o.auto) o.m=r4(o.m+dz); else {o.a0=r4(o.a0+dz);o.a1=r4(o.a1+dz);} } }
  else { o.x = r4(o.x+dx); o.z = r4(o.z+dz); }
  changed(); renderPlan(); syncPaneValues();
});
window.addEventListener("resize", () => renderPlan());
window.addEventListener("beforeunload", () => { if (dirty) save(); });

$("unitSel").value = unit;
$("unitSel").addEventListener("change", e => setUnit(e.target.value));
pane.addEventListener("click", e => { const b = e.target.closest("[data-unit]"); if (b) setUnit(b.dataset.unit); });
syncUndo(); setMode("select"); renderPane(); initStore();
})();
